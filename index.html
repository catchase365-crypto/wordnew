<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>S Pen 底层事件探针</title>
    <style>
        body {
            font-family: monospace;
            background: #121212;
            color: #00ff41;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #fff; }
        .controls {
            display: flex; gap: 10px; margin-bottom: 10px;
        }
        button {
            background: #222; border: 1px solid #00ff41; color: #00ff41;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        button:active { background: #00ff41; color: #000; }
        
        #testZone {
            flex: 1;
            background: #2a2a2a;
            border: 2px dashed #00ff41;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            /* 关键拦截属性 */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        #logContainer {
            height: 40%;
            margin-top: 10px;
            background: #000;
            border: 1px solid #333;
            overflow-y: auto;
            padding: 5px;
            font-size: 12px;
            border-radius: 4px;
        }
        .log-line { border-bottom: 1px solid #222; padding: 4px 0; }
        .log-down { color: #ffeb3b; }
        .log-up { color: #f44336; }
        .log-move { color: #4caf50; }
        .log-special { color: #00bcd4; font-weight: bold; background: rgba(0, 188, 212, 0.2); }
    </style>
</head>
<body>

    <h2>🖊️ S Pen 侧键探针检测器</h2>
    <div class="controls">
        <button onclick="clearLogs()">清空屏幕</button>
        <button onclick="exportLogs()">📥 导出日志 (JSON)</button>
    </div>

    <div id="testZone">
        在此区域使用 S Pen 按住侧键/松开侧键并划拉
    </div>

    <div id="logContainer"></div>

<script>
    const testZone = document.getElementById('testZone');
    const logContainer = document.getElementById('logContainer');
    
    let allLogs = [];
    let lastMoveButtons = -1;
    let moveCounter = 0;

    // 禁用右键菜单
    testZone.addEventListener('contextmenu', e => e.preventDefault());

    function addLog(e, eventType) {
        const timestamp = new Date().toISOString().split('T')[1].slice(0, -1);
        
        const logData = {
            time: timestamp,
            event: eventType,
            pointerType: e.pointerType,
            button: e.button,
            buttons: e.buttons,
            pressure: parseFloat(e.pressure).toFixed(2)
        };

        allLogs.push(logData);

        // 如果是 move 事件，为了防止刷屏，做个简单的节流，但如果 buttons 发生变化，强制打印
        if (eventType === 'pointermove') {
            if (e.buttons === lastMoveButtons) {
                moveCounter++;
                if (moveCounter % 10 !== 0) return; // 每 10 次 move 打印一次
            } else {
                logData.note = "⚠️ 状态突变!"; // 按键状态在移动中发生了改变
            }
            lastMoveButtons = e.buttons;
        }

        const div = document.createElement('div');
        div.className = `log-line log-${eventType.replace('pointer', '')}`;
        
        // 标记异常按键（非单点）
        if (e.buttons !== 0 && e.buttons !== 1) {
            div.classList.add('log-special');
        }

        div.innerText = `[${timestamp}] ${eventType.padEnd(12)} | type:${e.pointerType} | buttons:${e.buttons} | button:${e.button} | press:${logData.pressure} ${logData.note || ''}`;
        
        logContainer.prepend(div);

        // 保持屏幕日志不超过 200 条，防止浏览器崩溃
        if (logContainer.children.length > 200) {
            logContainer.removeChild(logContainer.lastChild);
        }
    }

    testZone.addEventListener('pointerdown', e => {
        testZone.setPointerCapture(e.pointerId);
        lastMoveButtons = e.buttons;
        addLog(e, 'pointerdown');
    });

    testZone.addEventListener('pointermove', e => {
        // 只有当有压力（在屏幕上滑动）或者悬停时按键状态改变才记录
        if (e.pressure > 0 || e.buttons !== lastMoveButtons) {
            addLog(e, 'pointermove');
        }
    });

    testZone.addEventListener('pointerup', e => {
        testZone.releasePointerCapture(e.pointerId);
        addLog(e, 'pointerup');
        lastMoveButtons = -1;
    });

    testZone.addEventListener('pointercancel', e => {
        testZone.releasePointerCapture(e.pointerId);
        addLog(e, 'pointercancel');
        lastMoveButtons = -1;
    });

    function clearLogs() {
        logContainer.innerHTML = '';
        allLogs = [];
        lastMoveButtons = -1;
    }

    function exportLogs() {
        if (allLogs.length === 0) {
            alert("还没有任何日志可以导出哦");
            return;
        }
        const dataStr = JSON.stringify(allLogs, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `spen_log_${new Date().getTime()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
