<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词家族生成器 (终极防套娃修复版)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="单词家族点读卡">
    <meta name="theme-color" content="#000000">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        :root {
            --primary-color: #7d5a50;
            --bg-grid: #f4f8ff;
            --card-w: 500px;
            --card-h: 1083px;
            --app-bg: #000000;
            --app-text: #00ff41;
            --app-border: #00ff41;
            --app-accent: #00ff41;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--app-bg);
            color: var(--app-text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }


        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: flex-start; gap: 10px; margin-bottom: 12px; } .icon-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; backdrop-filter: blur(5px); transition: all 0.2s; display: flex; align-items: center; gap: 5px; } .icon-btn:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.4); } .config-panel {
            background: #000000;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        
        h3 { margin-top: 0; color: #fff; text-align: center; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
        .tips { font-size: 12px; color: #bbb; margin-bottom: 8px; display: block; text-align: center; }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--app-border);
            background: var(--app-bg);
            color: var(--app-text);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1; padding: 12px; background: var(--app-bg); color: var(--app-text);
            border: 1px solid var(--app-border); border-radius: 4px; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        button:hover { filter: brightness(1.2); background: var(--app-accent); color: var(--app-bg); }
        .icon-btn {
            background: var(--app-bg); border: 1px solid var(--app-border); color: var(--app-text);
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;
            display: flex; align-items: center; gap: 5px; 
        }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #downloadBtn { background: #28a745; display: none; }
        #downloadDataBtn { background: #ff9800; display: none; }

        .results-grid {
            display: flex; flex-wrap: wrap; gap: 6px; width: 100%; max-width: 1200px;
            justify-content: center; padding-top: 15px;
        }
        @media (max-width: 768px) { .results-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        .image-wrapper {
            cursor: pointer;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: var(--card-w) / var(--card-h); position: relative;
        }
        .result-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .status-text { font-size: 14px; color: #666; text-align: center; padding: 10px; }
        .error-text { color: #dc3545; font-weight: bold; }

        /* ------------------ 渲染区样式 ------------------ */
        #stagingArea { position: absolute; top: -9999px; left: -9999px; opacity: 0; pointer-events: none; }
        
        
        .theme-oled { --card-bg: #000000; --text-color: #00ff41; --border-color: #008f11; --accent: #00ff41; --bg-img: none; --app-bg: #000000; --app-text: #00ff41; --app-border: #008f11; --app-accent: #00ff41; }
        .theme-oled .top-section, .theme-oled .bottom-section, .theme-oled .center-word, .theme-oled .header-box { background: rgba(0, 20, 0, 0.9) !important; color: #00ff41 !important; border-color: #008f11 !important; box-shadow: 0 0 10px rgba(0, 255, 65, 0.1); } .theme-oled .word-item { color: #000 !important; border-color: rgba(255,255,255,0.1) !important; }
        .theme-oled .zh-translation { color: #008f11; border-top-color: #004400; }
        .theme-oled .def-item { background: rgba(0, 40, 0, 0.4); }
        .theme-oled .def-item div { color: #00ff41 !important; }

        /* 棕褐阅读模式 (Sepia/ReadEra) */
        body.sepia-mode { background: #f4ecd8 !important; color: #5b4636 !important; }
        body.sepia-mode .config-panel { background: #fdfaf3; border: 1px solid #d3c4a9; box-shadow: 0 4px 10px rgba(93, 64, 55, 0.1); color: #5b4636; }
        body.sepia-mode .config-panel h3, body.sepia-mode .tips { color: #5b4636; }
        body.sepia-mode button, body.sepia-mode .icon-btn { background: #fdfaf3 !important; color: #5b4636 !important; border: 1px solid #d3c4a9 !important; }
        body.sepia-mode input, body.sepia-mode textarea, body.sepia-mode select { background: #fdfaf3; color: #5b4636; border: 1px solid #d3c4a9; }
        body.sepia-mode .category-tab { background: #fdfaf3; border: 1px solid #d3c4a9; color: #5b4636; }
        body.sepia-mode .category-tab.active { background: #8d6e63 !important; color: #fff !important; }
        body.sepia-mode .lightbox, body.sepia-mode .lightbox-inner { background: #f4ecd8 !important; }
        body.sepia-mode .lightbox-close, body.sepia-mode .lightbox-counter, body.sepia-mode .lightbox-fs-btn, body.sepia-mode .lightbox-trans-btn, body.sepia-mode .lightbox-menu {
            background: #fdfaf3; border: 1px solid #d3c4a9; color: #5b4636;
        }
        body.sepia-mode .menu-item {
            color: #5b4636; border: 1px solid rgba(141, 110, 99, 0.2);
        }
        body.sepia-mode .menu-item.active {
            background: #8d6e63; color: #fff; border-color: #8d6e63;
        }
        .theme-sepia { --card-bg: #f4ecd8; --text-color: #5b4636; --border-color: #d3c4a9; --accent: #8d6e63; --bg-img: none; --app-bg: #f4ecd8; --app-text: #5b4636; --app-border: #d3c4a9; --app-accent: #8d6e63; }
        .theme-sepia .top-section, .theme-sepia .bottom-section, .theme-sepia .center-word, .theme-sepia .header-box { background: #fdfaf3 !important; color: #5b4636 !important; border: 1px solid #d3c4a9 !important; } .theme-sepia .word-item { color: #111 !important; border: 1px solid rgba(0,0,0,0.1) !important; }
        .theme-sepia .zh-translation { color: #8d6e63; border-top-color: #d3c4a9; }
        .theme-sepia .def-item { background: rgba(141, 110, 99, 0.1); }
        .theme-sepia .def-item div { color: #5b4636 !important; }

                /* 墨水屏模式 (E-Ink) 专属样式全面强制覆盖 */
        body.ink-mode { --card-w: 750px; --card-h: 1000px; background: #ffffff !important; color: #000000 !important; }
        body.ink-mode .config-panel { background: #ffffff; border: 2px solid #000; box-shadow: none; color: #000; }
        body.ink-mode .config-panel h3, body.ink-mode .tips { color: #000; }
        body.ink-mode button, body.ink-mode .icon-btn { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; }
        body.ink-mode input, body.ink-mode textarea { background: #fff; color: #000; border: 2px solid #000; }
        body.ink-mode .category-tab { background: #fff; border: 2px solid #000; color: #000; }
        body.ink-mode .category-tab.active { background: #000 !important; color: #fff !important; }

        .theme-ink { --card-bg: #ffffff; --text-color: #000000; --border-color: #000000; --accent: #000000; --bg-img: none; --app-bg: #ffffff; --app-text: #000000; --app-border: #000000; --app-accent: #000000; }
        .theme-ink .top-section, .theme-ink .bottom-section, .theme-ink .center-word, .theme-ink .word-item, .theme-ink .header-box {
            background: #ffffff !important; color: #000000 !important; border: 2px solid #000000 !important; box-shadow: none !important;
        }
        .theme-ink .word-item { color: #000000 !important; }
        .theme-ink mark.hl { background-color: #e5e5e5 !important; color: #000000 !important; border: 1px solid #000000 !important; box-shadow: none !important; }
        .theme-ink .line { background-color: #000000 !important; height: 2px !important; }
        .theme-ink .zh-translation { color: #000000 !important; border-top-color: #000000 !important; }
        .theme-ink .def-item { background: #ffffff !important; border: 1px solid #000000 !important; }
        .theme-ink .def-item div { color: #000000 !important; }

        /* 核心适配：禁用苹果 iOS 长按弹出系统选择蓝块、拷贝菜单与放大镜 */
        [data-word], .word-item, .def-item, mark.hl {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        /* 隐藏翻译功能样式 */
        body.hide-translation .zh-translation, 
        body.hide-translation .zh-def { 
            visibility: hidden; 
        }
        /* 隐藏模式下点击或长按区域临时显示，方便自测查看 */
        body.hide-translation .zh-translation:active, 
        body.hide-translation .zh-def:active {
            visibility: visible !important;
            background: rgba(255, 255, 0, 0.2);
        }
        body.ink-mode .lightbox, body.ink-mode .lightbox-inner { background: #fff !important; }
        body.ink-mode .lightbox-close, body.ink-mode .lightbox-counter, body.ink-mode .lightbox-fs-btn, body.ink-mode .lightbox-trans-btn, body.ink-mode .lightbox-menu {
            background: #fff; border: 2px solid #000; color: #000;
        }

        .card-container {
            width: var(--card-w); 
            height: var(--card-h); 
            flex-shrink: 0;
            contain: content; 
            transition: opacity 0.3s ease;
            background-color: var(--card-bg, #f4f8ff);
            background-image: var(--bg-img);
            background-size: 40px 40px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column;
            padding: 10px 25px 20px 25px; color: #333;
            overflow: hidden; 
            position: relative;
        }

        .header-box {
            background: white; border: 2px solid #b0c4de;
            width: 75%; margin: 0 auto 10px auto; text-align: center;
            padding: 6px; font-size: 20px; font-weight: bold;
            color: var(--accent, var(--primary-color)); border-radius: 4px; border-color: var(--border-color);
            box-shadow: 2px 2px 0px #b0c4de; flex-shrink: 0;
        }

        .top-section {
            background: rgba(255, 255, 255, 0.7); padding: 12px 20px;
            border-radius: 12px; margin-bottom: 12px; margin-top: 52px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid rgba(176, 196, 222, 0.3);
            flex-shrink: 0;
        }
        
        .en-paragraph { 
            font-weight: 500; 
            font-size: 17px; 
            line-height: 2.5; 
            margin-bottom: 10px; 
            transition: all 0.2s;
            text-align: justify; 
        }
        .zh-translation { font-size: 15px; color: #555; border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 5px; line-height: 1.6;}
        
        .middle-tree {
            flex-grow: 1; position: relative;
            min-height: 280px; 
            width: 100%; margin-bottom: 10px;
        }
        
        .center-word {
            position: absolute; font-size: 20px; font-weight: bold;
            background: white; padding: 8px 16px; border: 1px solid #b0c4de;
            border-radius: 6px; z-index: 100; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .word-item {
            position: absolute; font-size: 16px; color: #333; z-index: 110;
            background: white; padding: 4px 8px; border-radius: 4px;
            font-weight: 600; white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee;
        }
        .line { position: absolute; height: 2px; transform-origin: left center; z-index: 5; }

        .bottom-section {
            background: rgba(255, 255, 255, 0.85); padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid rgba(176, 196, 222, 0.5); flex-shrink: 0;
            display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start;
            min-height: 150px;
        }
        
        .def-item {
            font-size: 14px; line-height: 1.4; background: rgba(240, 244, 255, 0.6);
            padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center;
        }

        .en-paragraph mark.hl {
            display: inline-block; 
            margin: 2px 4px;       
            line-height: 1.2;      
        }

        mark.hl { border-radius: 4px; padding: 2px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); color: #111; }
        /* 预览相册样式 */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; 
            height: 100vh; height: 100dvh;
            background: #000; z-index: 2000;
            display: none; justify-content: center; align-items: center; touch-action: none;
            overflow: hidden;
        }
        .lightbox-img { width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; transition: transform 0.3s; flex-shrink: 1; min-width: 0; min-height: 0; }

        .lightbox-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; height: 100dvh;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000;
            gap: 0;
            overflow: hidden;
            flex-direction: row;
        }
        .lightbox-close {
            position: absolute; top: 8px; right: 8px; color: white;
            font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px;
            z-index: 2100; cursor: pointer; backdrop-filter: blur(5px);
        }
        .lightbox-counter { position: absolute; top: 8px; left: 8px; color: white; font-size: 12px; background: rgba(0,255,65,0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; z-index: 2100; cursor: pointer; backdrop-filter: blur(5px); }
        
        .lightbox-loop-btn { position: absolute; top: 8px; right: 152px; color: white; font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; z-index: 2100; cursor: pointer; backdrop-filter: blur(5px); }
        .lightbox-pen-btn { position: absolute; top: 8px; right: 224px; color: white; font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; z-index: 2100; cursor: pointer; backdrop-filter: blur(5px); }
        .lightbox-pen-btn.active { background: #00ff41; color: #000; }
        .drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2050; pointer-events: none; touch-action: none; }
        .lightbox-trans-btn { position: absolute; top: 8px; right: 80px; color: white; font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; z-index: 2100; cursor: pointer; backdrop-filter: blur(5px); }
        .lightbox-fs-btn { position: absolute; top: 8px; right: 530px; color: white; font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; z-index: 2100; cursor: pointer; backdrop-filter: blur(5px); }
        .lightbox-menu { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.98); border: 1px solid #00ff41; border-radius: 8px; max-height: 85vh; width: 96vw; max-width: 1000px; overflow-y: auto; display: none; z-index: 2300; padding: 12px; box-shadow: 0 0 30px rgba(0,255,65,0.5); grid-template-columns: repeat(3, 1fr); gap: 6px; touch-action: auto; }
        .tablet-only { display: none !important; }
        @media (min-width: 768px) { .tablet-only { display: flex !important; } }
        .pen-controls-top { display: flex; align-items: center; gap: 8px; position: absolute; top: 8px; right: 300px; z-index: 2100; height: 32px; }
        .pen-controls-top .icon-btn-lite { color: white; font-size: 12px; background: rgba(0, 255, 65, 0.2); border: 1px solid #00ff41; padding: 4px 12px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(5px); height: 26px; display: flex; align-items: center; }
        .pen-controls-top input[type=range] { width: 80px; height: 4px; accent-color: #00ff41; cursor: pointer; }
        .pen-toolbar { display: none; } /* Removed old bottom toolbar */
        .pen-toolbar input[type=range] { width: 100px; margin: 0; cursor: pointer; accent-color: #00ff41; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; }
        .color-dot.active { border-color: #fff; transform: scale(1.2); }
        .menu-item { padding: 10px 4px; color: #00ff41; font-size: 11px; cursor: pointer; border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .menu-item:hover { background: rgba(0, 255, 65, 0.1); }
        .menu-item.active { background: #00ff41; color: #000; font-weight: bold; }

                /* 分类导航栏样式 */
        .category-tab.is-read {
            background: #1b5e20 !important;
            border-color: #00ff41 !important;
            color: #ffffff !important;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.5);
        }
        body.sepia-mode .category-tab.is-read {
            background: #d7ccc8 !important; 
            border-color: #8d6e63 !important;
            color: #5b4636 !important;
        }
        body.ink-mode .category-tab.is-read {
            background: #e0e0e0 !important;
            border-color: #000000 !important;
            color: #000000 !important;
            text-decoration: line-through;
        }
        .category-tab.is-read::before {
            content: "✓ ";
            font-weight: bold;
        }
        .category-tabs {
            width: 100%; max-width: 1200px; margin: 0 auto 15px auto;
            display: grid; grid-template-rows: repeat(5, auto); grid-auto-flow: column;
            gap: 8px; overflow-x: auto; padding: 5px 0 15px 0; scrollbar-width: thin;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .category-tab {
            background: #000; border: 1px solid #00ff41;
            color: #00ff41; padding: 4px 10px; border-radius: 4px; cursor: pointer;
            font-size: 12px; transition: all 0.2s; white-space: nowrap; text-align: center;
            margin: 2px;
        }
        .category-tab.active {
            background: #00ff41; border-color: #00ff41; color: #000; font-weight: bold;
        }
        /* iOS/iPhone 兼容模拟全屏样式优化 */
        body.is-pseudo-fullscreen {
            padding: 0 !important;
            margin: 0 !important;
            height: 100vh; height: 100dvh;
            overflow: hidden !important;
        }
        body.is-pseudo-fullscreen .top-bar {
            padding-top: env(safe-area-inset-top);
        }

        /* --- 双语句子级同步聚焦高亮样式 --- */
        .en-paragraph, .zh-translation {
            transition: all 0.3s ease;
        }
        /* 当开启句子聚焦时，让卡片内其余未被高亮的句子自动变淡，产生完美的“非破坏性”舞台聚焦效果 */
        .card-container.has-focus .tts-sentence:not(.active-focus),
        .card-container.has-focus .zh-sentence:not(.active-focus) {
            opacity: 0.3;
        }
        .tts-sentence, .zh-sentence {
            transition: all 0.25s ease;
            border-radius: 4px;
            padding: 0 2px;
            display: inline;
        }
        /* OLED绿模式下的句子高亮：半透明荧光绿底 + 白字加外发光 */
        .theme-oled .active-focus {
            background-color: rgba(0, 255, 65, 0.25) !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
            opacity: 1 !important;
        }
        /* 棕褐阅读模式下的句子高亮：柔和深啡色底 */
        .theme-sepia .active-focus {
            background-color: rgba(141, 110, 99, 0.25) !important;
            color: #5b4636 !important;
            opacity: 1 !important;
        }
        /* 墨水屏模式下的句子高亮：反色为纯黑底白字，确保极高对比度 */
        .theme-ink .active-focus {
            background-color: #000000 !important;
            color: #ffffff !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>

<div class="config-panel">
    <h3>🧙‍♀️Catchase单词家族点读卡</h3>
    
    <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">

// 新增：根据卡片内被点击的组件，往上追溯并标记该卡片为已阅读状态
function markCardAsReadByElement(el) {
    if (!el) return;
    const card = el.closest('.card-container');
    if (!card) return;
    const cardKey = card.getAttribute('data-card-key');
    if (cardKey && !readCards.has(cardKey)) {
        readCards.add(cardKey);
        localStorage.setItem('catchase_read_cards', JSON.stringify([...readCards]));
        const homeTabs = document.querySelectorAll('#resultsGrid .category-tab');
        homeTabs.forEach(tab => {
            if (tab.getAttribute('data-card-key') === cardKey) {
                tab.classList.add('is-read');
            }
        });
    }
}



function toggleFullScreen() {
    const doc = document;
    const de = doc.documentElement;
    const isFull = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

    const syncUI = () => {
        setTimeout(() => {
            window.scrollTo(0, 0);
            if (document.getElementById('lightbox').style.display === 'flex') {
                updateLightboxContent();
            }
        }, 350);
    };

    if (!isFull) {
        const req = de.requestFullscreen || de.webkitRequestFullscreen || de.mozRequestFullScreen || de.msRequestFullscreen;
        if (req) {
            req.call(de).then(syncUI).catch(err => {
                doc.body.classList.add('is-pseudo-fullscreen');
                syncUI();
            });
        } else {
            doc.body.classList.add('is-pseudo-fullscreen');
            syncUI();
        }
    } else {
        const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
        if (exit) {
            exit.call(doc).then(syncUI).catch(() => {
                doc.body.classList.remove('is-pseudo-fullscreen');
                syncUI();
            });
        } else {
            doc.body.classList.remove('is-pseudo-fullscreen');
            syncUI();
        }
    }
}

// 升级版跨平台唤端引擎：完美适配 iOS 独立 App 安全策略
// 升级版跨平台唤端引擎：增加 Android 分屏焦点强刷安全锁
window.callEudic = function(word, el) {
    if (!word) return;
    if (el) markCardAsReadByElement(el);
    
    // 强制剥离当前页面的所有文本选择蓝块与输入焦点，预防 Chrome 内核将触控死锁在被长按元素上
    try {
        window.getSelection().removeAllRanges();
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
        }
    } catch(e) {}

    const url = `eudic://dict/${encodeURIComponent(word)}`;
    
    // 精准判定当前设备是否为苹果设备
    const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    
    const isPC = !('ontouchstart' in window) && window.matchMedia('(pointer: fine)').matches;
    if (isPC) return; // 电脑端禁止触发欧路词典，仅限移动端

    if (isApple) {
        window.location.href = url;
    } else {
        let iframe = document.getElementById('eudic-trigger-iframe');
        if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.id = 'eudic-trigger-iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
        }
        iframe.src = url;
    }
};

function speakTTS(text, event, sIdx, btnEl) {
    if (event && event.target) markCardAsReadByElement(event.target);
    if(event) event.stopPropagation();
    if(!text) return;
    
    // 1. 核心版本计数，废弃因快速切换产生的异步幽灵回调
    const mySpeechId = ++currentSpeechId; 
    
    // 2. 【核心大修】：强制结束并立刻强行恢复通道！
    // 专门用来击碎长按单词调起欧路分屏时，Android 系统由于剥夺音频焦点导致的 Chrome 深度睡死状态
    window.speechSynthesis.cancel();
    if (window.speechSynthesis.resume) {
        window.speechSynthesis.resume();
    }

    // 全局重置所有卡片的聚焦状态，防止样式残留
    document.querySelectorAll('.card-container').forEach(c => {
        c.classList.remove('has-focus');
        c.querySelectorAll('.active-focus').forEach(el => el.classList.remove('active-focus'));
    });

    // 如果传入了句子索引（说明是点击了句子，而非单个单词），开启舞台聚焦
    let currentCard = null;
    if (sIdx !== undefined && btnEl) {
        currentCard = btnEl.closest('.card-container');
        if (currentCard) {
            currentCard.classList.add('has-focus');
            currentCard.querySelectorAll(`.tts-sentence[data-index="${sIdx}"], .zh-sentence[data-index="${sIdx}"]`)
                       .forEach(el => el.classList.add('active-focus'));
        }
    }

    const u = new SpeechSynthesisUtterance(text);
    
    // 3. 【核心大修】：将语音实例强行挂载到全局 window 对象上
    // 防止长句子在分屏焦点切换、重新建立系统 TTS 通道时，被浏览器的垃圾回收(GC)机制当成闲置变数误杀
    window.currentSpeechUtterance = u;

    const voiceSelect = document.getElementById('voiceSelect');
    const voices = speechSynthesis.getVoices();
    const selectedVoice = voices.find(v => v.voiceURI === voiceSelect.value);
    if (selectedVoice) u.voice = selectedVoice;
    u.lang = 'en-US';
    u.rate = 0.9;
    
    // 朗读完毕后释放状态
    u.onend = () => {
        if (mySpeechId !== currentSpeechId) return; 
        
        if (currentCard) {
            currentCard.classList.remove('has-focus');
            currentCard.querySelectorAll('.active-focus').forEach(el => el.classList.remove('active-focus'));
        }
        if (isAutoLoop) {
            setTimeout(() => {
                if (isAutoLoop && mySpeechId === currentSpeechId) speakTTS(text, null, sIdx, btnEl);
            }, 500);
        }
    };

    // 异常与打断事件保护
    u.onerror = () => {
        if (mySpeechId !== currentSpeechId) return; 
        
        if (currentCard) {
            currentCard.classList.remove('has-focus');
            currentCard.querySelectorAll('.active-focus').forEach(el => el.classList.remove('active-focus'));
        }
    };

    // 4. 正式推入引擎执行
    window.speechSynthesis.speak(u);
}

function handlePCWordRightClick(e) {
    const isPC = !('ontouchstart' in window) && window.matchMedia('(pointer: fine)').matches;
    if (!isPC) return; 

    e.preventDefault();
    e.stopPropagation();

    let word = "";
    if (e.target.classList.contains('hl')) {
        word = e.target.innerText;
    } else {
        if (document.caretRangeFromPoint) {
            const range = document.caretRangeFromPoint(e.clientX, e.clientY);
            const sel = window.getSelection();
            if (range) {
                range.expand('word');
                sel.removeAllRanges();
                sel.addRange(range);
                word = sel.toString().trim();
                sel.removeAllRanges();
            }
        }
    }
    
    word = word.replace(/[.,/#!$%^&*;:{}=\-_`~()"']/g,"");
    if (word && word.length > 0) {
        speakTTS(word);
    }
}

function createBaseCardDOM(data) {
    const card = document.createElement('div');
    const theme = isInkMode ? 'ink' : currentGlobalTheme;
    card.className = `card-container theme-${theme}`;
    card.setAttribute('data-card-key', `${data.c}_${data.theme}`);

    const topSec = document.createElement('div');
    topSec.className = 'top-section';

    // [核心大修]：单次扫描正则替换引擎
    // 1. 保留原始索引并按长度降序排序（防止"train"优先匹配导致"training"被截断）
    const sortedWords = data.words.map((w, index) => ({...w, originalIndex: index}))
                                  .sort((a, b) => b.word.length - a.word.length);
    
    // 2. 将10个单词拼接成一个巨大的正在表达式: \b(word1|word2|word3)\b
    const escapedWords = sortedWords.map(w => w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const combinedRegex = new RegExp(`\\b(${escapedWords.join('|')})\\b`, 'gi');

    // 3. 将英文段落按句子切分，外层包裹发音 span，内部进行单词高亮！
    const enSentences = data.paragraph_en.match(/[^.?!]+[.?!]*/g) || [data.paragraph_en];
    let enHTML = '';
    enSentences.forEach((sentence, idx) => {
        const highlightedSentence = sentence.replace(combinedRegex, (match) => {
            const lowerMatch = match.toLowerCase();
            const foundWord = sortedWords.find(w => lowerMatch === w.word.toLowerCase());
            if (foundWord) {
                const color = HighlighterColors[foundWord.originalIndex % HighlighterColors.length];
                return `<mark class="hl" style="background-color: ${color};">${match}</mark>`;
            }
            return match;
        });
        const cleanText = sentence.replace(/'/g, "\\'").replace(/"/g, "&quot;").trim();
        enHTML += `<span class="tts-sentence" data-index="${idx}" onclick="speakTTS('${cleanText}', event, ${idx}, this)" style="cursor:pointer;">${highlightedSentence}</span>`;
    });

    // 新增：将中文翻译同步按句子切分，建立完全一致的索引映射
    const zhSentences = data.paragraph_zh.match(/[^。！？]+[。！？]*/g) || [data.paragraph_zh];
    let zhHTML = '';
    zhSentences.forEach((sentence, idx) => {
        zhHTML += `<span class="zh-sentence" data-index="${idx}">${sentence}</span>`;
    });

    topSec.innerHTML = `
        <div class="en-paragraph" oncontextmenu="handlePCWordRightClick(event)">${enHTML}</div>
        <div class="zh-translation">翻译：${zhHTML}</div>
    `;
    card.appendChild(topSec);

    const midSec = document.createElement('div');
    midSec.className = 'middle-tree';
    card.appendChild(midSec);

    const botSec = document.createElement('div');
    botSec.className = 'bottom-section';
    let defHTML = '';
    data.words.forEach((item, i) => {
        const color = HighlighterColors[i % HighlighterColors.length];
        const cleanWord = item.word.replace(/'/g, "\\'");
        defHTML += `<div class="def-item" data-word="${cleanWord}" style="flex-direction: column; align-items: flex-start; cursor:pointer; transition: transform 0.2s;" onclick="speakTTS('${cleanWord}', event)" oncontextmenu="window.callEudic('${cleanWord}', this); return false;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
            <div style="margin-bottom: 2px;"><mark class="hl" style="background-color: ${color}; font-weight: 600; margin-right: 6px;">${item.word}</mark><span style="font-size: 12px; color: #888;">${item.phonetic || ''}</span></div>
            <div class="zh-def" style="color: #444;">${item.definition}</div>
        </div>`;
    });
    botSec.innerHTML = defHTML;
    card.appendChild(botSec);

    return card;
}

async function applyAutoFitLogic(cardDOM) {
    // 提高初始字号以填充上方空间，缩小中下间距
    let fontEn = 25; 
    let fontZh = 20;
    let fontDef = 16;
    let lhEn = 2.2; 

    const enPara = cardDOM.querySelector('.en-paragraph');
    const zhPara = cardDOM.querySelector('.zh-translation');
    const botSec = cardDOM.querySelector('.bottom-section');
    const limitH = isInkMode ? 980 : 1070;

    // [注释：卡片上中下的上部分中英文段翻译]
    // 初始应用较大字号
    enPara.style.fontSize = `${fontEn}px`;
    enPara.style.lineHeight = `${lhEn}`;
    zhPara.style.fontSize = `${fontZh}px`;
    botSec.querySelectorAll('.def-item').forEach(el => el.style.fontSize = `${fontDef}px`);

    // 动态检测：如果总高度超过卡片高度，则逐步缩小字号
    while (cardDOM.scrollHeight > limitH && fontEn > 14) {
        fontEn -= 0.4;
        fontZh -= 0.3;
        fontDef -= 0.2;
        
        if (lhEn > 1.6) lhEn -= 0.03;

        enPara.style.fontSize = `${fontEn}px`;
        enPara.style.lineHeight = `${lhEn}`;
        zhPara.style.fontSize = `${fontZh}px`;
        
        const defItems = botSec.querySelectorAll('.def-item');
        defItems.forEach(el => {
            el.style.fontSize = `${Math.max(12, fontDef)}px`;
        });
    }
}

function drawDynamicTree(cardDOM, data) {
    const midSec = cardDOM.querySelector('.middle-tree');
    const midWidth = midSec.offsetWidth;
    const midHeight = midSec.offsetHeight;
    
    const centerX = midWidth / 2;
    const centerY = midHeight / 2;
    const radius = Math.min(midWidth, midHeight) / 2 - 45;

    const center = document.createElement('div');
    center.className = 'center-word';
    center.innerText = `${data.pos || ''}. ${data.theme}`;
    center.style.left = `${centerX}px`;
    center.style.top = `${centerY}px`;
    center.style.transform = `translate(-50%, -50%)`;
    midSec.appendChild(center);

    data.words.forEach((item, i) => {
        const color = HighlighterColors[i % HighlighterColors.length];
        const angleDeg = (i * (360 / data.words.length)) - 90;
        const angleRad = angleDeg * (Math.PI / 180);
        
        const x = centerX + Math.cos(angleRad) * radius;
        const y = centerY + Math.sin(angleRad) * radius;

        const el = document.createElement('div');
        const cleanWordAttr = item.word.replace(/'/g, "\\'");
        el.className = 'word-item';
        el.style.backgroundColor = color; 
        el.style.cursor = 'pointer';
        el.setAttribute('data-word', cleanWordAttr);
        el.setAttribute('onclick', `speakTTS('${cleanWordAttr}', event)`);
        el.setAttribute('oncontextmenu', `window.callEudic('${cleanWordAttr}'); return false;`);
        el.style.userSelect = 'none'; 
        el.style.webkitUserSelect = 'none';
        el.innerText = item.word;
        
        const cos = Math.cos(angleRad);
        const sin = Math.sin(angleRad);
        
        let tx = -50;
        if (cos > 0.3) tx = 0; else if (cos < -0.3) tx = -100;
        let ty = -50;
        if (sin > 0.7) ty = 0; else if (sin < -0.7) ty = -100;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.transform = `translate(${tx}%, ${ty}%)`;
        midSec.appendChild(el);

        const line = document.createElement('div');
        line.className = 'line';
        line.style.backgroundColor = color; 
        line.style.left = `${centerX}px`;
        line.style.top = `${centerY}px`;
        const lineLength = radius - 35;
        line.style.width = `${lineLength}px`;
        line.style.transform = `rotate(${angleDeg}deg) translate(35px, 0)`; 
        midSec.appendChild(line);
    });
}

function applyThemeToBody() {
    document.body.classList.remove('ink-mode', 'sepia-mode');
    const root = document.documentElement;
    const themeClass = isInkMode ? 'theme-ink' : `theme-${currentGlobalTheme}`;
    
    const tempDiv = document.createElement('div');
    tempDiv.className = themeClass;
    document.body.appendChild(tempDiv);
    const style = getComputedStyle(tempDiv);
    
    const bgColor = style.getPropertyValue('--app-bg').trim() || '#000000';
    const textColor = style.getPropertyValue('--app-text').trim() || '#00ff41';
    const borderColor = style.getPropertyValue('--app-border').trim() || '#00ff41';
    const accentColor = style.getPropertyValue('--app-accent').trim() || '#00ff41';

    root.style.setProperty('--app-bg', bgColor);
    root.style.setProperty('--app-text', textColor);
    root.style.setProperty('--app-border', borderColor);
    root.style.setProperty('--app-accent', accentColor);
    document.body.removeChild(tempDiv);

    const dynamicElements = ['voiceSelect', 'themeToggleBtn'];
    dynamicElements.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.style.background = bgColor;
            el.style.color = textColor;
            el.style.borderColor = borderColor;
        }
    });

    if (isInkMode) {
        document.body.classList.add('ink-mode');
    } else if (currentGlobalTheme === 'sepia') {
        document.body.classList.add('sepia-mode');
    }

    if (isHideTranslation) {
        document.body.classList.add('hide-translation');
        document.getElementById('hideTransBtn').innerText = '👁️ 显示中文';
    } else {
        document.body.classList.remove('hide-translation');
        document.getElementById('hideTransBtn').innerText = '👁️ 隐藏中文';
    }
    
    const btn = document.getElementById('themeToggleBtn');
    if(btn) btn.innerText = currentGlobalTheme === 'oled' ? '🌃 深色模式 (绿)' : '📜 棕褐模式 (亮)';
    document.getElementById('inkModeBtn').innerText = isInkMode ? '📖 墨水屏:开' : '📖 墨水屏:关';
}

async function initApp() {
    applyThemeToBody();
    populateVoiceList();
    const syncStatus = document.getElementById('syncStatus');
    try {
        allImportedData = await localforage.getItem('word_cards_db');
        
        if (!allImportedData || allImportedData.length === 0) {
            syncStatus.style.display = 'block';
            syncStatus.innerHTML = '✨ 首次访问：正在从 GitHub 同步 20,000 条核心数据...<br><span style="font-size:11px; opacity:0.8;">(约 27MB，仅首次加载需要消耗流量)</span>';
            
            const files = ['./data/part1.jsonl', './data/part2.jsonl'];
            let combinedData = [];
            
            for (const file of files) {
                const response = await fetch(file);
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim());
                
                lines.forEach(line => {
                    try {
                        const parsed = JSON.parse(line);
                        combinedData.push({
                            c: parsed.c || '未分类',
                            theme: parsed.t,
                            pos: parsed.pos || '',
                            ui: parsed.ui || 'modern',
                            words: parsed.w.map(word => ({
                                word: word.n, phonetic: word.p, definition: word.d
                            })),
                            paragraph_en: parsed.en,
                            paragraph_zh: parsed.zh
                        });
                    } catch (err) {}
                });
            }
            
            allImportedData = combinedData;
            await localforage.setItem('word_cards_db', allImportedData);
            syncStatus.innerText = '✅ 同步完成！数据已持久化到本地离线空间。';
            setTimeout(() => syncStatus.style.display = 'none', 3000);
        }

        const categories = new Set(allImportedData.map(d => d.c));
        const categoryList = Array.from(categories).sort();
        renderCategoryTabs(categoryList);
        if (categoryList.length > 0) await renderCategory(categoryList[0]);

    } catch (error) {
        console.error('Initialization error:', error);
        syncStatus.style.display = 'block';
        syncStatus.innerText = '❌ 数据同步失败，请检查网络或路径配置。';
    }
}

function initDrawingCanvas() {
    const canvas = document.getElementById('drawingCanvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawingCtx = canvas.getContext('2d');
    
    // 引入独立的手指长按/短按状态跟踪器
    let fingerTimer = null;
    let isLongPressTriggered = false;
    let startX = 0;
    let startY = 0;
    let targetElement = null;

    const getLineWidth = (p) => {
        const pressure = (p > 0) ? p : 0.5;
        return pressure * (currentPenWeight * 2) + 1;
    };

    // 1. 按下事件监听
    canvas.onpointerdown = (e) => {
        // 【电磁笔模式】仅允许 S-Pen 书写批注
        if (isPenMode && e.pointerType === 'pen') {
            isDrawing = true;
            drawingCtx.beginPath();
            drawingCtx.moveTo(e.clientX, e.clientY);
            drawingCtx.lineWidth = getLineWidth(e.pressure || 0.5);
            drawingCtx.strokeStyle = currentPenColor;
            drawingCtx.lineJoin = 'round';
            drawingCtx.lineCap = 'round';
            e.preventDefault();
            e.stopPropagation();
        } 
        // 【手指触摸模式】处理点读与长按穿透
        else if (isPenMode) {
            isLongPressTriggered = false;
            startX = e.clientX;
            startY = e.clientY;
            
            // 瞬间穿透画布获取底层的真实 DOM 节点
            canvas.style.pointerEvents = 'none';
            targetElement = document.elementFromPoint(e.clientX, e.clientY);
            canvas.style.pointerEvents = 'auto';

            if (targetElement) {
                // 开启 500ms 纯净长按判定定时器
                fingerTimer = setTimeout(() => {
                    isLongPressTriggered = true;
                    // 只有点在单词身上才执行欧陆长按唤起
                    const wordNode = targetElement.closest('[data-word]');
                    if (wordNode && window.callEudic) {
                        window.callEudic(wordNode.getAttribute('data-word'));
                    }
                }, 500);
            }
            e.preventDefault();
            e.stopPropagation();
        }
    };

    // 2. 移动事件监听（加入防抖容错）
    canvas.onpointermove = (e) => {
        if (isDrawing && e.pointerType === 'pen') {
            drawingCtx.lineTo(e.clientX, e.clientY);
            drawingCtx.lineWidth = getLineWidth(e.pressure || 0.5);
            drawingCtx.stroke();
            drawingCtx.beginPath();
            drawingCtx.moveTo(e.clientX, e.clientY);
            e.preventDefault();
            e.stopPropagation();
        } 
        // 手指在长按过程中如果发生大幅度拖拽，则取消长按（允许 12 像素内的肉肉手微小抖动）
        else if (isPenMode && fingerTimer) {
            const moveX = Math.abs(e.clientX - startX);
            const moveY = Math.abs(e.clientY - startY);
            if (moveX > 12 || moveY > 12) {
                clearTimeout(fingerTimer);
                fingerTimer = null;
            }
        }
    };

    // 3. 抬起事件监听（核心时序控制）
    canvas.onpointerup = (e) => {
        if (e.pointerType === 'pen') {
            isDrawing = false;
            drawingCtx.beginPath();
        } else if (isPenMode) {
            // 手指抬起时，立刻掐断定时器
            if (fingerTimer) {
                clearTimeout(fingerTimer);
                fingerTimer = null;
            }
            
            // 重要：只有在 500ms 内抬起、且从未触发过长按弹窗时，才判定为“普通短按”
            if (!isLongPressTriggered && targetElement) {
                // 【漏洞修复】：同时判定点击的目标是否属于单词（data-word）或长句子（.tts-sentence）
                const wordNode = targetElement.closest('[data-word]');
                const sentenceNode = targetElement.closest('.tts-sentence');
                
                if (wordNode || sentenceNode) {
                    targetElement.click(); // 完美允许穿透点击长句子
                }
            }
            targetElement = null;
        }
    };

    // 4. 异常中断处理
    canvas.onpointercancel = () => {
        isDrawing = false;
        if (fingerTimer) {
            clearTimeout(fingerTimer);
            fingerTimer = null;
        }
        targetElement = null;
    };
}

async function updateLightboxContent() {
    clearDrawingCanvas();
    const inner = document.getElementById('lightboxInner');
    // 使用 clientWidth/Height 排除滚动条干扰，确保 GitHub 与本地计算一致
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const winRatio = winW / winH;
    const cardW = isInkMode ? 750 : 500;
    const cardH = isInkMode ? 1000 : 1083;

    // 自适应计算同屏卡片数
    const cardRatio = cardW / cardH;
    if (winRatio > cardRatio * 3.5) cardsPerView = 4;
    else if (winRatio > cardRatio * 2.5) cardsPerView = 3;
    else if (winRatio > cardRatio * 1.5) cardsPerView = 2;
    else cardsPerView = 1;

    const gap = 0;
    const totalCardWidth = cardsPerView * cardW;
    let finalScale = Math.min(winW / totalCardWidth, winH / cardH);
    // 确保在高度受限时，缩放比例能让卡片尽可能填满垂直空间
    if (winH / cardH < winW / totalCardWidth) {
        finalScale = winH / cardH;
    }

    // 批量触发当前组的懒加载
    const indices = [];
    for (let i = 0; i < cardsPerView; i++) {
        indices.push((currentGalleryIndex + i) % rawResultsData.length);
    }
    await triggerLazyLoadBatch(indices);

    inner.innerHTML = '';
    
    // 渲染卡片组：通过包装层消除 transform:scale 留下的空白间隙
    indices.forEach(idx => {
        const domNode = generatedDOMs[idx];
        if (domNode) {
            const cardW = isInkMode ? 750 : 500;
            const cardH = isInkMode ? 1000 : 1083;
            const wrapper = document.createElement('div');
            wrapper.style.width = (cardW * finalScale) + 'px';
            wrapper.style.height = (cardH * finalScale) + 'px';
            wrapper.style.display = 'flex';
            wrapper.style.justifyContent = 'center';
            wrapper.style.alignItems = 'center';
            wrapper.style.flexShrink = '0';

            const displayNode = domNode.cloneNode(true);
            displayNode.style.transform = `scale(${finalScale})`;
            displayNode.style.transformOrigin = 'center top';
            displayNode.style.flexShrink = '0';
            displayNode.style.margin = '0';
            // 修正全屏下位置偏移，确保顶端对齐
            wrapper.style.alignItems = 'flex-start';
            wrapper.style.paddingTop = '0';
            
            wrapper.appendChild(displayNode);
            inner.appendChild(wrapper);
        }
    });

    // 导航箭头
    const arrowColor = isInkMode ? '#000' : (currentGlobalTheme === 'sepia' ? '#5b4636' : (currentGlobalTheme === 'oled' ? '#00ff41' : 'var(--app-accent)'));
    const arrowShadow = (currentGlobalTheme === 'ink' || currentGlobalTheme === 'sepia') ? 'none' : '0 0 10px #000';
    
    const navPrev = document.createElement('div');
    navPrev.innerHTML = '❮';
    navPrev.style.cssText = `position:absolute; left:20px; color:${arrowColor}; font-size:50px; cursor:pointer; z-index:2200; text-shadow:${arrowShadow};`;
    navPrev.onclick = (e) => { e.stopPropagation(); prevImage(); };
    
    const navNext = document.createElement('div');
    navNext.innerHTML = '❯';
    navNext.style.cssText = `position:absolute; right:20px; color:${arrowColor}; font-size:50px; cursor:pointer; z-index:2200; text-shadow:${arrowShadow};`;
    navNext.onclick = (e) => { e.stopPropagation(); nextImage(); };
    
    inner.appendChild(navPrev);
    inner.appendChild(navNext);

    const counter = document.getElementById('lightboxCounter');
    const startIdx = currentGalleryIndex + 1;
    const endIdx = Math.min(currentGalleryIndex + cardsPerView, rawResultsData.length);
    
    if (currentCategory === 'Random') {
        counter.innerText = `🎲 随机模式 [${startIdx === endIdx ? startIdx : `${startIdx}-${endIdx}`}]`;
        counter.onclick = null;
        counter.style.cursor = 'default';
    } else {
        counter.innerText = (startIdx === endIdx ? startIdx : `${startIdx}-${endIdx}`) + ` / ${rawResultsData.length} ☰`;
        counter.onclick = (e) => { e.stopPropagation(); toggleLightboxMenu(); };
        counter.style.cursor = 'pointer';
    }
}

function nextImage(e) {
    if (e) e.stopPropagation();
    // 按组跳转
    currentGalleryIndex = (currentGalleryIndex + cardsPerView) % rawResultsData.length;

}

function prevImage(e) {
    if (e) e.stopPropagation();
    // 按组往回跳，处理负数取余
    currentGalleryIndex = (currentGalleryIndex - cardsPerView + rawResultsData.length) % rawResultsData.length;
    updateLightboxContent();
}

async function triggerLazyLoad(index) {
    if (!generatedDOMs[index] && rawResultsData[index]) {
        const data = rawResultsData[index];
        const cardDOM = createBaseCardDOM(data);
        document.getElementById('stagingArea').appendChild(cardDOM);
        await applyAutoFitLogic(cardDOM);
        drawDynamicTree(cardDOM, data);
        generatedDOMs[index] = cardDOM.cloneNode(true);
        const canvas = await html2canvas(cardDOM, { scale: 2, backgroundColor: null });
        generatedImagesData[index] = { theme: data.theme, dataUrl: canvas.toDataURL('image/png') };
        cardDOM.remove();
    }
}

async function triggerLazyLoadBatch(indices) {
    const tasks = indices.map(idx => triggerLazyLoad(idx));
    await Promise.all(tasks);
}

function downloadAllData() {
    const validData = rawResultsData.filter(item => item !== null);
    if(validData.length === 0) return;

    const uiTheme = "oled";
    
    let jsonlContent = "";
    validData.forEach(data => {
        const compressed = {
            t: data.theme,
            pos: data.pos,
            ui: uiTheme,
            w: data.words.map(w => ({
                n: w.word,
                p: w.phonetic,
                d: w.definition
            })),
            en: data.paragraph_en,
            zh: data.paragraph_zh
        };
        jsonlContent += JSON.stringify(compressed) + "\n";
    });

    const blob = new Blob([jsonlContent], { type: "application/octet-stream" });
    saveAs(blob, "单词卡片纯文本数据.jsonl");
}

// 终极修复：全平台普通浏览模式手势代理引擎
// 彻底解决 Android Chrome 分屏流下，从欧路切回时文本 span 的原生 click 事件被浏览器吞噬的硬伤
document.addEventListener('DOMContentLoaded', () => {
    let globalFingerTimer = null;
    let globalLongPressActive = false;
    let gStartX = 0, gStartY = 0;
    let gTargetElement = null;

    const lbInner = document.getElementById('lightboxInner');
    if (!lbInner) return;

    lbInner.addEventListener('touchstart', (e) => {
        if (isPenMode) return; // 如果开启了批注模式，交由 Canvas 层的指针事件全权处理
        
        // 智能识别：既寻找单词块，也寻找长句子 span
        gTargetElement = e.target.closest('[data-word]') || e.target.closest('.tts-sentence');
        if (!gTargetElement) return;
        
        globalLongPressActive = false;
        gStartX = e.touches[0].clientX;
        gStartY = e.touches[0].clientY;
        
        // 只有点在单词身上时，才启动 500ms 长按欧路唤醒时序
        if (gTargetElement.hasAttribute('data-word')) {
            globalFingerTimer = setTimeout(() => {
                globalLongPressActive = true;
                const word = gTargetElement.getAttribute('data-word');
                if (word && window.callEudic) {
                    // 唤起前强制清理全局选择集与高亮蓝块，防止内核焦点锁死
                    window.getSelection().removeAllRanges();
                    if(document.activeElement) document.activeElement.blur();
                    window.callEudic(word);
                }
            }, 500);
        }
    }, { passive: true });

    lbInner.addEventListener('touchmove', (e) => {
        if (isPenMode || !globalFingerTimer) return;
        const moveX = Math.abs(e.touches[0].clientX - gStartX);
        const moveY = Math.abs(e.touches[0].clientY - gStartY);
        // 允许 12px 的脂肪形变微小手抖，超过则判定为翻页滑动，掐断长按
        if (moveX > 12 || moveY > 12) {
            clearTimeout(globalFingerTimer);
            globalFingerTimer = null;
        }
    }, { passive: true });

    lbInner.addEventListener('touchend', (e) => {
        if (isPenMode) return;
        
        if (globalFingerTimer) {
            clearTimeout(globalFingerTimer);
            globalFingerTimer = null;
        }
        
        if (gTargetElement) {
            if (globalLongPressActive) {
                // 如果是长按唤醒，直接拦截后续动作，防止松手时误触发单词读音
                e.preventDefault();
                e.stopPropagation();
            } else {
                // 🚀【核心高能修复】：如果是普通短按点击，不管你是单词还是长句子，
                // 坚决不走浏览器脆弱的原生 click 转发，直接由 JS 原生驱动强制触发 .click() 
                // 并调用 preventDefault 阻断 Chrome 内核的无理拦截，实现 100% 秒开点读！
                e.preventDefault();
                e.stopPropagation();
                gTargetElement.click();
            }
        }
        gTargetElement = null;
    }, { passive: false }); // 必须为 false 允许 preventDefault 拦截系统默认吞选行为
});

// 新增全局窗口焦点重置监听：只要你从左侧欧路词典把手递回右侧 Chrome，瞬间洗净所有的选择残留
window.addEventListener('focus', () => {
    try {
        window.getSelection().removeAllRanges();
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
            document.activeElement.blur();
        }
    } catch(err) {}
});

async function downloadAllImages() {
    const validImages = generatedImagesData.filter(item => item !== null);
    if(validImages.length === 0) return;

    if(validImages.length === 1) {
        const link = document.createElement('a');
        link.download = `批注单词卡-${validImages[0].theme}.png`;
        link.href = validImages[0].dataUrl;
        link.click();
    } else {
        const zip = new JSZip();
        validImages.forEach(img => {
            const base64Data = img.dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
            zip.file(`批注单词卡-${img.theme}.png`, base64Data, {base64: true});
        });
        try {
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "批注单词卡批量下载.zip");
        } catch(e) {
            console.error("ZIP打包失败", e);
            alert("文件打包失败，请检查浏览器权限。");
        }
    }
}
</script>
